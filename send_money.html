<!DOCTYPE html>
<html>
<head>
    <title>Send Money</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

    <a href="dashboard.php" class="back-btn">← Back</a>

    <h2>Send Money</h2>

    <form action="send_money_process.php" method="POST">

        <label>Receiver Wallet ID:</label>
        <input type="number" name="receiver_wallet" placeholder="Enter wallet ID" required>

        <label>Amount:</label>
        <input type="number" name="amount" step="0.01" placeholder="Enter amount" required>

        <label>PIN:</label>
        <input type="password" name="pin" placeholder="Enter your PIN" required>

        <button type="submit">Send Money</button>

    </form>

</div>

</body>
</html>
